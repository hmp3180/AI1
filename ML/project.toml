# project.toml — ML
#   **게임이 아니다.** 사전학습 0 · 바이트 0..255 만으로 시작하는 계층적 latent tokenizer 와 그 학습기.
#   설계·엔진 진단·작업 순서는 전부 `ML.md` 에 있다 — 이 프로젝트를 만지기 전에 그것을 읽는다.
#
# ★ **1단계가 창 앱인 것은 제약이 아니라 이득이다.** 이 엔진의 컴퓨트 제출은 `Present` 경로에
#   묶여 있어서(→ ML.md 의 진단 B) 창 없이는 디스패치가 안 돈다. 그런데 학습 곡선과 **경계를 찍은 그림**이
#   이 프로젝트의 핵심 판정 도구라, 창이 있는 편이 오히려 맞다(`--devctl shot` 으로 그걸 찍는다).
#   ⇒ headless `PETrainer` 는 P5 에서, 컴퓨트 배치 API 를 뗀 뒤에 만든다.
project_name = "ML"
entry_module_name = "MLApp"

# ★ GUI 기본 스케일모드 = **physical**(1 gui px = 1 논리 px = dp). 게임의 `virtual` 과 반대다 —
#   이것은 **툴**이라 창 크기를 바꿔도 글자/위젯 크기가 변하지 않아야 한다(→ Docs/Guide.md 그 절).
#   ⚠️ 손실 곡선·경계 그림을 눈으로 재는 도구라 이 성질이 특히 중요하다(줌에 따라 눈금이 변하면 못 잰다).
default_gui_scale_mode = "physical"

[app]
display_name = "PE ML"

[shell]
host = "gui"
mode = "engine_framed"
# ★ 넓게 잡는다 — 왼쪽에 손실 곡선, 오른쪽에 **경계를 찍은 텍스트**를 나란히 놓을 자리다.
#   ⚠️ 요청 크기는 **논리 px** 이라 DPI 배율이 곱해진다(150% 면 1280×800 → 1920×1200 물리 px).
#   ⚠️⚠️ 크기를 바꿀 일이 생기면 **여기서** 바꾼다 — `Start()` 에서 `SetClientSize` 로 덮으면
#     설정을 고쳐도 아무 일도 안 난다(→ Docs/Guide.md 의 그 함정).
width = 1280
height = 800
resizable = true
start_visible = true
start_focused = true
center = true

# ⚠️ 안드로이드는 **끈다**(`project_build.toml` 의 `[platforms.android] enabled = false`).
#   학습을 폰에서 돌리는 것은 이 프로젝트의 목표가 아니고, 켜 두면 쿡/빌드가 두 배로 갈린다.
#   ★ 그래도 블록은 남겨 둔다 — 나중에 **추론만** 폰에 올릴 여지가 있고, 그때 값을 새로 찾지 않게.
[android]
package_name = "com.peengine.ml"
version_code = 1
version_name = "0.1.0"
activity_type = "native"
orientation = "landscape"
immersive = true

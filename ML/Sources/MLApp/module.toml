# module.toml
# MLApp — 이 프로젝트의 **엔트리 모듈**(= exe). 학습 루프와 시각화가 사는 자리.
#
# ★ **진입 창 클래스가 없다.** `main_class` 가 엔진 클래스를 가리키므로 빈 파생 창을 만들 이유가
#   없고(cwgen 이 마지막 이름 조각으로 헤더를 찾는다), 창의 **모듈 스코프**는 타입 태그가 아니라
#   **엔트리 모듈** 이름으로 정해진다(cwgen 이 `_cwmain.cpp` 에 심는다).
#   ⇒ 그래서 `mltrainer.cw` 의 `MLTrainer`(WindowSubsystem 파생)가 이 창에 **자동으로 붙는다**.
#
# ⚠️ 설계·엔진 진단·작업 순서는 `Projects/ML/ML.md` 에 있다 — 만지기 전에 읽는다.

type = "module"

main_class = "PE::BasicWindow"
main_class_type = "window"

import = [
	"Core",
	"OS",
	"RHI",
	# ★ RHI 구현. ⚠️ **import 해야 로드/등록된다**(엔트리가 문자열로만 스폰하므로 앵커가 필요하다).
	"RHI_Vulkan",
	"Asset",
	# ★ **CPU 픽셀 그리기 원시형**(`ImageOps`) — `domain draw` 가 이것으로 프레임을 만든다.
	#   ★ 이 모듈은 GPU/RHI 를 모르는 **순수 CPU** 라 학습 루프 어디서든 부를 수 있고, 그 헤더가
	#     *"소비자가 둘이 될 자리 — 쿡 타임(AssetGen)과 런타임 절차 생성"* 이라고 예고해 뒀다.
	#     ⇒ **우리가 그 첫 런타임 소비자다**(⚠️ `Gen::*` 는 `assetgen` = 쿡 타임 전용이라 쓸 수 없다 —
	#       그쪽 산출은 고정 데이터셋이 되고 학습엔 매 스텝 랜덤화된 무한 데이터가 필요하다).
	"ImageFormat",
	# ★ 모델/학습의 몸통(텐서 아레나·커널·CPU 레퍼런스). ⚠️ RHI 를 직접 쓰는 컴퓨트 전용 모듈이다.
	"MLCore",
	# 🪞 **트랜스포머 트랙의 조립체**(`-mlt`) — 블록 쌓기 · (심볼,값) 슬롯 · 사건 생성기 · 단계 러너.
	#   ⚠️ 정본은 `Projects/ML/MLT.md` · `mltconcept.md` 다. ⚠️ import 를 빼면 **고립 모듈**이라
	#     컴파일은 되지만 조용히 등록/로드되지 않는다.
	"MLT",
	"Graphics",
	# ★ `domain draw` 의 배관 — 도메인 등록 · `ScriptRunner`(소스 문자열을 그대로 컴파일) ·
	#   `ScriptReflection`(`self.*` 를 프로퍼티로 여는 기계). ⚠️ GUI 가 전이적으로 끌어오지만
	#   **무엇을 쓰는지가 이 파일에 보여야** 한다.
	"Script",
	# ★ 창 서브시스템의 베이스(`GUIWindowSubsystem`)가 여기 있다 — GUI 펌프를 손으로 펼 일이 없다.
	"GUI",
	"Framework",
	# ★ **셰이더 핫리로드 + 자동 쿡** — 코드 0줄, 이 한 줄이 전부다.
	#   ⚠️⚠️ 이 프로젝트에서 **가장 값진 한 줄**이다: 커널 HLSL(`gemm`·`adamw`…)을 고치면 학습을 켜 둔 채
	#     그 자리에서 반영된다. 커널 수십 개를 반복 수정하는 작업이라 이게 없으면 매번 재시작이다.
	"AutoCook",
]

# ⚠️ **일부러 빠뜨린 것들** — 없어서 못 넣은 게 아니라 안 쓰기 때문이다(고립 모듈은 컴파일만 되고
#   등록이 안 되므로, 쓰게 되는 날 여기 한 줄을 더한다):
#   · `World`/`SceneRenderer`/`Viewport` — 3D 씬이 없다(엔티티도 카메라도 없는 툴이다).
#   · `Script`(직접) — GUI 가 전이적으로 끌어온다. 학습 설정을 `.pes` 로 쓰게 되면 그때 명시한다.
#   · `AssetGen` — 코퍼스는 저작한 `.bytes` 지 생성된 애셋이 아니다.

# module.toml
# MLCore — 🧠 **모델과 학습의 몸통.** 텐서 아레나 · 커널 · 오토그래드 · CPU 레퍼런스가 여기 산다.
#
# ★ **RHI 를 직접 쓴다** — `Docs/Guide.md` 의 그 예외(*"컴퓨트 전용 모듈은 RHI 를 직접 써도 된다"*)에
#   해당한다. 이 모듈은 **아무것도 그리지 않는다**(래스터가 없다) — GPU 를 계산 장치로만 쓴다.
#   ★ 반대로 밀어붙였으면 텐서 아레나·GEMM 파라미터·옵티마이저 상태가 **Graphics 원시형**이 되어
#     그래픽스 모듈이 그래픽스 아닌 어휘를 배웠을 것이다(= `room` 을 엔진에서 내려보낸 것과 같은 판정).
#
# ⚠️ **엔트리(MLApp)와 갈린 이유**: MLApp 은 **앱 껍데기**다(창·GUI·프로브·시각화). 모델은 창을 몰라야
#   하고, 나중에 headless 트레이너(P5)가 같은 몸통을 쓴다 — 그때 GUI 를 끌고 가지 않으려면 지금 갈라야 한다.
#
# 🌐 MLT P3-A1의 이동 가능한 rank-2 상대 발자국도 이 경계를 따른다. 순·역전파 GPU 원시형 네 장과
#   CPU 레퍼런스만 여기 있고, 전역 top-k 조립과 고정 프레임 판정은 MLT 모듈에 남는다.

type = "module"

import = [
	"Core",
	# ★ GPU 를 계산 장치로 쓴다(버퍼·컴퓨트 셰이더·디스패치·리드백). 위 예외의 대상이다.
	"RHI",
	# ★ 쿡된 `.spv` 를 애셋으로 받는 길(`ShaderAsset`).
	"Asset",
	# ⚠️ **Graphics 를 import 하지 않는다** — 그리지 않으므로 필요가 없다.
	#   ★ 그리고 그것이 이 모듈이 갈려 있는 것의 값이다: 렌더 스택 전체가 의존에서 빠진다.
]

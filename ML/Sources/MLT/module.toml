# module.toml
# MLT — 🪞 **트랜스포머 트랙의 조립체.** 사전학습 0 · 토크나이저 0 으로 「접지된 언어」를 배운다.
#
# ⚠️ **설계·단계·관문은 `Projects/ML/MLT.md`, 원리는 `Projects/ML/mltconcept.md`** 가 정본이다.
#   만지기 전에 읽는다. ⚠️ ML 트랙의 `concept.md` 를 **줄번호로 인용하지 않는다**(그 인용이 한 번
#   통째로 깨졌다 — 343 → 1853줄).
#
# ★ **왜 MLCore 와 갈렸나** — 그 모듈이 자기 역할을 *"모델과 학습의 몸통(텐서 아레나 · 커널 ·
#   오토그래드 · CPU 레퍼런스)"* 로 못 박아 뒀다. ⇒ **커널과 CPU 레퍼런스는 그쪽**이고, 여기 사는 것은
#   **조립과 세계**다: 블록 쌓기 · (심볼,값) 슬롯 표기 · 사건 생성기 · 단계 러너.
#   ★ 그 갈림의 값: 커널을 늘리는 일과 커리큘럼을 늘리는 일이 **서로를 안 건드린다.**
#
# ⚠️ **엔트리(MLApp)와도 갈렸다** — 창·GUI·프로브는 그쪽이다. 이 모듈은 창을 몰라야 하고,
#   그래야 나중에 headless 로 같은 몸통을 돌릴 수 있다(MLCore 가 갈린 것과 같은 이유).
#
# 🌐 회차 44의 P3-A1 조립은 `mltp2enc.cw`의 전역 top-k/상대 발자국 모드와 `mltp3a1.cw`의
#   고정 프레임 A/B에 있다. semantic id 1/8종 붕괴로 종료됐으며 다음 P3 몸통은 열지 않는다.
# 🧭 회차 45의 `mltp3a2.cw`는 모델을 바꾸지 않고 고정 8장 공유 학습으로 위치/identity 식별가능성만 쟀다.
#   모든 장면 id 1종·같은 붕괴 id 8/8장으로 실패했으며 추가 데이터/스텝 없이 종료했다.

type = "module"

import = [
	"Core",
	# ★ 커맨드라인(단계 선택 플래그)·파일(체크포인트·로그).
	"OS",
	# ★ GPU 를 계산 장치로 쓴다. ⚠️ `Docs/Guide.md` 의 그 예외(컴퓨트 전용 · 아무것도 안 그린다)에
	#   해당하고, MLCore 가 이미 그 판정을 받아 뒀다.
	"RHI",
	# ★ 쿡된 `.spv` 를 애셋으로 받는 길.
	"Asset",
	# ★ **CPU 픽셀 원시형** — 🌍 세계의 프레임을 만들고 👁️ 재구성 오차를 그림으로 되읽는다.
	#   ⚠️ `Gen::*`(assetgen)은 쿡 타임 전용이라 못 쓴다 — 학습은 매 스텝 랜덤화된 무한 데이터가 필요하다.
	"ImageFormat",
	# ★ **몸통** — 아레나 · 커널 · CPU 레퍼런스 · gradcheck.
	"MLCore",
	# ⚠️ **Graphics·GUI·Framework 를 import 하지 않는다** — 그리지 않으므로 필요가 없다.
	#   ★ 그것이 이 모듈이 갈려 있는 값이다(렌더 스택 전체가 의존에서 빠진다).
]
